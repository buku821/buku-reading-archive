  <script>
    const books=[{"title":"2026-07-29｜《优秀到不能被忽视》","author":"卡尔·纽波特","category":"不可替代性 / 职业成长","date":"2026-07-29","topic":"优秀到不能被忽视","summary":"这本书解决的是一个很容易让人焦虑的问题：**我到底该做什么，才能既赚到钱，又越来越喜欢自己的工作？** 很多职业建议让人先找到“真正热爱的事”，再把它变成事业。可现…","quotes":["热爱不一定是起点，它也可能是把一件有价值的事做深之后的结果。","市场不会因为你很努力就奖励你，它更在意你解决了什么问题。","真正的职业安全感，不来自一份不会消失的工作，而来自一组带得走的能力。","自由不是先离开约束，而是先拥有和约束谈条件的筹码。","工作年限只是时间，能被验证的进步才是职场资本。","不可替代不是没有人能做，而是别人复制你的整套能力需要付出很高成本。","使命通常藏在能力的前沿；还没走近问题，就很难看清值得做什么。","与其用一次豪赌证明热爱，不如用一连串小成果验证方向。"],"review":"好工作通常不是先被找到的，而是用稀缺能力和真实成果逐步换来的。","content":"\u003ch2>今天为什么读这本\u003c/h2>\n\u003cp>这本书解决的是一个很容易让人焦虑的问题：\u003cstrong>我到底该做什么，才能既赚到钱，又越来越喜欢自己的工作？\u003c/strong>\u003c/p>\n\u003cp>很多职业建议让人先找到“真正热爱的事”，再把它变成事业。可现实往往是：你还没做出像样的成果，也没有看清市场需要什么，就不断换方向；每一次不顺，都被解释成“这不是我的热爱”。结果不是更自由，而是能力、收入和信心都没有积累起来。\u003c/p>\n\u003cp>《优秀到不能被忽视》给出了一条更能落地的路：先练出市场真正需要、又不是人人都会的能力，再用这份能力换取更好的收入、更大的自主权和更有意义的工作。它适合正在职业迷茫、想转行、觉得自己很努力却没有议价权，或想建立个人品牌时读。\u003c/p>\n\u003cp>这和你的长期能力直接相关：普通人真正稳固的安全感，不是永远选对赛道，而是无论环境怎么变，都有能力持续做出别人愿意付费、愿意合作、难以替代的成果。\u003c/p>\n\u003ch2>这本书在讲什么\u003c/h2>\n\u003cp>卡尔·纽波特是一位计算机科学教授和非虚构作家。2012 年出版这本书时，他挑战了当时很流行的职业口号——“追随你的激情”。他不是说兴趣不重要，也不是劝人忍受一份糟糕的工作；他真正反对的是：\u003cstrong>把一种清晰、稳定、预先存在的热爱，当成选择职业的必要起点。\u003c/strong>\u003c/p>\n\u003cp>全书可以用一条因果链理解：\u003c/p>\n\u003cp>\u003cstrong>工匠思维 → 稀缺能力 → 职场资本 → 自主权与影响力 → 更满意、更有意义的工作。\u003c/strong>\u003c/p>\n\u003ch3>1. 从“工作能给我什么”，切换到“我能提供什么”\u003c/h3>\n\u003cp>“激情思维”最先问：这份工作符合我的天命吗？它让我快乐吗？“工匠思维”先问：我能把什么事情做得真正出色？我能给客户、团队或市场创造什么价值？\u003c/p>\n\u003cp>这不是让人放弃感受，而是调整顺序。刚入门时，任何领域都有笨拙、重复和不自由；如果只用当下感受判断方向，往往还没进入能获得成就感的阶段就离开了。很多热爱不是先被找到，而是在能力增长、获得认可、掌握主动权之后慢慢形成的。\u003c/p>\n\u003ch3>2. 用刻意练习积累“职场资本”\u003c/h3>\n\u003cp>作者把\u003cstrong>稀缺且有价值的能力\u003c/strong>称为“职场资本”。好的工作通常带有自主、创造、影响力等稀缺条件，市场不会仅因为你想要，就免费把这些条件交给你。你需要先有别人愿意交换的筹码。\u003c/p>\n\u003cp>职场资本不是“工作年限”，也不是看了多少知识。它来自有目标的练习：主动挑稍高于当前水平的任务，接受真实反馈，修正薄弱处，再反复产出。真正的检验标准是，你能否比过去更稳定地解决问题，并留下能被别人验证的成果。\u003c/p>\n\u003ch3>3. 用资本换自主权，但不要过早裸奔\u003c/h3>\n\u003cp>当一个人能力变得稀缺，他就能争取项目选择权、工作方式、时间安排和报价空间。自主权会显著提升工作满意度，但书里也提醒了两个陷阱。\u003c/p>\n\u003cp>第一个陷阱是：能力还没形成，就急着辞职、创业或完全自由职业。看似自由，实际上没有客户、成果和现金流支撑。第二个陷阱是：当你变得有价值后，组织反而可能不愿给你更多自由，因为它想继续控制你的产出。\u003c/p>\n\u003cp>所以，争取自由既需要勇气，也需要证据。一个朴素的检验是：\u003cstrong>是否已经有人愿意为你的新方向付出钱、时间、资源或真实承诺。\u003c/strong> 赞美和点赞不是市场验证。\u003c/p>\n\u003ch3>4. 使命不是坐着想出来的，而是在能力前沿长出来的\u003c/h3>\n\u003cp>很多人一开始就想找到一个宏大的使命，却因为离行业前沿太远，只能得到模糊口号。作者的路径是：先进入一个领域，持续积累能力和视野；当你看见别人还没解决、但确实重要的问题时，使命才有材料。\u003c/p>\n\u003cp>找到方向后，也不要立刻押上全部。先做“小赌注”：一篇内容、一次咨询、一个小产品、一个短项目。用低成本实验获得真实反馈，再决定是否加码。这样既能保留理想，也不会让一次判断失误摧毁积累。\u003c/p>\n\u003ch2>我真正应该带走的 5 个判断\u003c/h2>\n\u003ch3>1. 不知道热爱什么时，先追踪“什么值得练”\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 等待一个让你瞬间确定的方向，会把职业选择变成情绪测试。真正可靠的线索通常是：这件事有真实需求、你愿意长期练、进步能够被看见。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 比较机会时，不只问“我喜不喜欢”，再加三问：它能积累什么能力？这种能力是否稀缺？一年后能留下什么可展示的成果？\u003c/p>\n\u003ch3>2. 忙碌不等于积累，只有可验证的进步才算资本\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 开会、回消息、重复熟悉任务，会制造“我很努力”的感觉，却未必让你更值钱。市场为解决问题付费，不为疲惫程度付费。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 每周挑一项核心能力，安排一次有难度、有反馈、有成品的练习。用作品、成交率、处理速度、质量或复购等结果判断进步，而不是只记工作时长。\u003c/p>\n\u003ch3>3. 想获得更多自由，先让自己拥有交换自由的筹码\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 没有稀缺能力时，自由常常只是缺少保障；拥有职场资本后，自由才会变成选择客户、项目、价格和时间的权利。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 想独立做事时，先找一位真实客户完成小规模付费交付；想转行时，先做出目标岗位需要的作品，再用面试反馈或录用意向验证。拿到真实信号后，再决定是否重投入。\u003c/p>\n\u003ch3>4. 不可替代不是“什么都会”，而是有一组难复制的能力组合\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 单项技能迟早会普及，真正难替代的是组合：例如懂业务、能表达、会交付、还能建立信任。别人可以快速补一项，很难同时复制你的整套组合和实战记录。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 选一项主能力，再补两项能放大它的能力。比如“产品判断 + 写作表达 + 客户沟通”，并让三者在同一个真实项目里共同出现。\u003c/p>\n\u003ch3>5. 大方向靠小实验发现，不靠一次豪赌证明\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 使命感很容易让人高估自己的判断。小实验既能保护已有积累，又能让客户、数据和真实使用场景替你纠偏。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 对任何想长期做的新方向，先设计一个两周内能完成的最小成果，并提前写清楚继续加码的标准：谁会使用、谁愿付费、什么反馈才算需求成立。\u003c/p>\n\u003cp>下面 8 条都是对本书思想的凝练转述，不作原文引用。\u003c/p>\n\u003ch2>金句\u003c/h2>\n\u003col>\n\u003cli>热爱不一定是起点，它也可能是把一件有价值的事做深之后的结果。\u003c/li>\n\u003cli>市场不会因为你很努力就奖励你，它更在意你解决了什么问题。\u003c/li>\n\u003cli>真正的职业安全感，不来自一份不会消失的工作，而来自一组带得走的能力。\u003c/li>\n\u003cli>自由不是先离开约束，而是先拥有和约束谈条件的筹码。\u003c/li>\n\u003cli>工作年限只是时间，能被验证的进步才是职场资本。\u003c/li>\n\u003cli>不可替代不是没有人能做，而是别人复制你的整套能力需要付出很高成本。\u003c/li>\n\u003cli>使命通常藏在能力的前沿；还没走近问题，就很难看清值得做什么。\u003c/li>\n\u003cli>与其用一次豪赌证明热爱，不如用一连串小成果验证方向。\u003c/li>\n\u003c/ol>\n\u003ch2>和赚钱能力/人脉/情绪/不可替代性的关系\u003c/h2>\n\u003ch3>赚钱能力\u003c/h3>\n\u003cp>赚钱能力的核心不是“会多少”，而是能否稳定创造别人愿意交换资源的价值。把学习从收藏知识改成解决真实问题：先确认谁需要、问题有多痛、结果怎么衡量，再练交付。报价时也少强调自己投入了多少时间，多展示你能减少什么成本、增加什么结果，以及过去如何做到。\u003c/p>\n\u003ch3>不可替代性\u003c/h3>\n\u003cp>不要把不可替代理解成把所有事情揽在身上。真正的壁垒是：有清晰的主能力、有互相增强的能力组合、有持续更新的方法，还有一串可信的成果记录。每完成一个项目，都留下案例、数据、复盘或推荐语，让能力从“我觉得我会”变成别人能验证的证据。\u003c/p>\n\u003ch3>人脉壁垒\u003c/h3>\n\u003cp>高质量人脉往往从共同做事长出来。能力越扎实，你越有机会进入更好的项目；在项目里稳定交付、分享方法、帮别人解决关键问题，又会带来更深的信任。与其泛泛认识更多人，不如让五个真正懂行的人清楚知道：哪类难题交给你最放心。\u003c/p>\n\u003ch3>情绪管理\u003c/h3>\n\u003cp>职业焦虑常把三个问题混在一起：我现在还不够好、这个环境确实不适合我、这个方向没有真实需求。把它们分开，情绪就会变成信息。先用一次刻意练习检验能力，用一次边界沟通检验环境，用一次小规模交付检验需求，再决定该坚持、调整还是离开。\u003c/p>\n\u003ch2>今天可以做的一件小事\u003c/h2>\n\u003cp>花 25 分钟，做一张“职场资本清单”。\u003c/p>\n\u003col>\n\u003cli>写下你希望未来一年拥有的一个选择权，例如提高报价、转岗、接独立项目。\u003c/li>\n\u003cli>写出获得它最需要的 3 项能力，并圈出目前最弱、但最值得练的一项。\u003c/li>\n\u003cli>给这项能力设计一个本周能完成的最小作品，例如一页方案、一次客户访谈、一篇案例拆解或一个可演示的小成果。\u003c/li>\n\u003cli>写下谁能给你真实反馈，以及什么结果算“比上次更好”。\u003c/li>\n\u003c/ol>\n\u003cp>今天先预约反馈的人，或在日历里锁定第一次 30 分钟练习。不要再买一门课，先做出一个能被看见的东西。\u003c/p>\n\u003ch2>以后回看时看这 3 行\u003c/h2>\n\u003cul>\n\u003cli>好工作通常不是先被找到的，而是用稀缺能力和真实成果逐步换来的。\u003c/li>\n\u003cli>先积累职场资本，再用它换收入、自主权、影响力和更有意义的选择。\u003c/li>\n\u003cli>不可替代靠能力组合与兑现记录；大方向靠低成本的小实验验证。\u003c/li>\n\u003c/ul>"},{"title":"2026-07-28｜《关键对话》","author":"约瑟夫·格雷尼、科里·帕特森、罗恩·麦克米兰、艾尔·史威茨勒、埃米莉·格雷戈里","category":"情绪管理 / 人际协作","date":"2026-07-28","topic":"关键对话","summary":"《关键对话》解决的是一个人人都会遇到、却经常处理不好的问题：当事情很重要、双方意见不一致、情绪又开始上来时，怎么既不忍着，也不把关系谈崩。 加薪、分工、催款、拒绝、…","quotes":["真正重要的关系，不靠回避分歧维持，而靠分歧出现后仍能说真话。","当你只想证明自己正确时，你通常已经偏离了真正想要的结果。","情绪不是对方直接塞给你的；事实与情绪之间，还隔着你讲给自己的故事。","安全感不是让所有人舒服，而是让所有人敢把重要信息放到桌面上。","先描述摄像头能拍到的事实，再讨论你对事实的解释。","沉默和攻击看似相反，本质上都是退出共同解决问题。","最有力量的表达，不是把判断说得像事实，而是坚定地表达，也允许被修正。","一场谈话如果没有明确下一步，往往只是交换了情绪，没有改变现实。"],"review":"关键对话失控时，先恢复共同目标和安全感，再继续讨论内容。","content":"\u003ch2>今天为什么读这本\u003c/h2>\n\u003cp>《关键对话》解决的是一个人人都会遇到、却经常处理不好的问题：当事情很重要、双方意见不一致、情绪又开始上来时，怎么既不忍着，也不把关系谈崩。\u003c/p>\n\u003cp>加薪、分工、催款、拒绝、指出问题、和亲近的人谈边界，都属于关键对话。我们往往不是不知道该说什么，而是一到现场就走向两个极端：要么沉默、绕开、表面答应；要么语气变硬、急着证明自己正确。短期看像是躲过了冲突，长期却会把小问题养成信任、合作和金钱上的大损失。\u003c/p>\n\u003cp>这本书适合在你心里正压着一句“不知道怎么说的话”时读。它和长期能力的关系很直接：真正稳定的人脉，不是永远没有分歧，而是有分歧后仍能交换真实信息、修复信任、推动行动。越能处理别人不愿碰的难题，你越容易成为合作中不可替代的人。\u003c/p>\n\u003ch2>这本书在讲什么\u003c/h2>\n\u003cp>作者把“关键对话”定义为同时具备三个特征的谈话：\u003cstrong>结果很重要、观点有分歧、情绪很强烈。\u003c/strong> 难点不只是措辞，而是人在感到威胁时，会本能地从“共同解决问题”切换到“自我保护”。\u003c/p>\n\u003cp>自我保护通常有两种表现。第一种是沉默：回避、敷衍、隐瞒真实想法；第二种是攻击：贴标签、控制对话、讽刺或指责。一个人不说真话，另一个人也开始防御，双方能够共同使用的信息越来越少，最后只能凭猜测做决定。\u003c/p>\n\u003cp>书里最核心的目标，是建立一个“共享信息池”：每个人都能把自己看到的事实、担心和判断放到桌面上。信息越完整，决定越可能靠谱；即使最终意见仍不一致，彼此也知道为什么这样决定。\u003c/p>\n\u003cp>要做到这一点，可以按五步理解。\u003c/p>\n\u003cp>第一，先问清自己真正想要什么。你是想解决问题、保住关系并得到结果，还是只想赢、出气、让对方认错？目标一旦从“赢过对方”变成“共同处理问题”，说话方式就会改变。\u003c/p>\n\u003cp>第二，观察安全感是否正在消失。对方突然沉默、转移话题、开始讽刺，或你自己心跳加快、语气变冲，都是信号。此时继续堆事实通常没用，要先让双方重新相信：这场谈话不是攻击，而是为了一个共同目标。\u003c/p>\n\u003cp>第三，把事实和解释分开。事实是摄像头能拍到的内容，例如“这周约定的三个节点有两个没有交付”；解释是“你不重视这件事”。解释可能合理，也可能只是大脑为了填补空白讲出的故事。先说事实，再把自己的解释当作一种待验证的可能，对方才有空间补充信息。\u003c/p>\n\u003cp>第四，既表达自己，也真心探索对方。可以先说可核验的事实，再说自己的担心，然后用试探而不是定罪的语气提问：“这是我目前的理解，也可能漏了什么，你怎么看？”听对方时，不急着反驳，先复述你听到的重点，确认双方讨论的是同一个问题。\u003c/p>\n\u003cp>第五，把谈话变成行动。聊得坦诚不等于问题已经解决。结束前要明确：谁负责什么、什么时候完成、用什么标准确认、何时再检查。没有这一步，很多“聊开了”只是一次情绪释放。\u003c/p>\n\u003ch2>我真正应该带走的 5 个判断\u003c/h2>\n\u003ch3>1. 越想躲开的谈话，往往越值得尽早谈\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 回避只能消除眼前的不舒服，不能消除问题。含糊的分工、迟迟不谈的边界和长期不说的不满，会在时间里累积利息。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 如果一件事一周内反复占据你的注意力，就不要只在脑中排练。先写下可核验的事实和你想得到的结果，再约一个明确的时间谈。\u003c/p>\n\u003ch3>2. 安全感不是客气，而是让真话能够出现\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 对方一旦觉得自己正在被羞辱、控制或否定，就会把精力用于自保。此时你说得越多，他听进去的越少。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 发现对方沉默或反击时，暂停争论内容，先说明你的目的：“我不是想否定你，我想把交付问题解决，也希望我们以后合作更顺。”\u003c/p>\n\u003ch3>3. 冲突常常不是事实冲突，而是故事冲突\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 人会把观察到的片段迅速解释成动机，例如把“没有回复”解释成“不尊重”，再带着愤怒行动。真正伤关系的，往往是把推测当事实。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 开口前画两栏：左边写摄像头能记录的事实，右边写你的解释。谈话时先说左边，再把右边变成问题去核实。\u003c/p>\n\u003ch3>4. 共同目标比漂亮话术更能降低对抗\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 只要双方认为目标互相排斥，任何技巧都会像操纵。找到一个双方都在乎的更大结果，才可能从“你输我赢”变成“我们一起处理”。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 在谈价格、分工或边界前，先补一句：“我们都希望什么结果？”例如合作既要按时交付，也要让投入与回报相匹配。\u003c/p>\n\u003ch3>5. 好对话的标准不是聊得舒服，而是信息更全、行动更清楚\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 有些谈话气氛很好，却没有决定；有些谈话有一点不舒服，却让责任、期限和风险变清晰。舒服不是结果，清晰才是。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 结束前确认四件事：谁来做、做什么、何时完成、怎么回看。把它写进消息里，避免双方带着不同版本离开。\u003c/p>\n\u003cp>下面 8 条均为全书思想的凝练转述，不作原文引用。\u003c/p>\n\u003ch2>金句\u003c/h2>\n\u003col>\n\u003cli>真正重要的关系，不靠回避分歧维持，而靠分歧出现后仍能说真话。\u003c/li>\n\u003cli>当你只想证明自己正确时，你通常已经偏离了真正想要的结果。\u003c/li>\n\u003cli>情绪不是对方直接塞给你的；事实与情绪之间，还隔着你讲给自己的故事。\u003c/li>\n\u003cli>安全感不是让所有人舒服，而是让所有人敢把重要信息放到桌面上。\u003c/li>\n\u003cli>先描述摄像头能拍到的事实，再讨论你对事实的解释。\u003c/li>\n\u003cli>沉默和攻击看似相反，本质上都是退出共同解决问题。\u003c/li>\n\u003cli>最有力量的表达，不是把判断说得像事实，而是坚定地表达，也允许被修正。\u003c/li>\n\u003cli>一场谈话如果没有明确下一步，往往只是交换了情绪，没有改变现实。\u003c/li>\n\u003c/ol>\n\u003ch2>和赚钱能力/人脉/情绪/不可替代性的关系\u003c/h2>\n\u003ch3>情绪管理\u003c/h3>\n\u003cp>情绪管理不是强迫自己冷静，而是更早发现自己已经进入防御状态。想打断、想翻旧账、想立刻证明对方错时，先停下来问：“我真正想要的结果是什么？”这个问题能把你从情绪反应拉回目标。\u003c/p>\n\u003ch3>人脉壁垒\u003c/h3>\n\u003cp>浅关系靠顺利维持，深合作靠修复分歧建立。别人会记住的，不只是你平时是否好相处，还包括出问题时你能不能讲事实、不甩锅、听得进不同信息，并把关系带回合作轨道。这种可信任的处理能力，很难被一次社交技巧替代。\u003c/p>\n\u003ch3>赚钱能力\u003c/h3>\n\u003cp>谈报价、催回款、争取资源、拒绝不合理需求，都需要关键对话能力。不会谈的人常用让步购买短暂和平，最后损失利润、时间和边界。能把价值、成本、责任和期限说清楚，本身就是把能力变成收入的一部分。\u003c/p>\n\u003ch3>不可替代性\u003c/h3>\n\u003cp>团队里最稀缺的常常不是“最会发言的人”，而是能让真实问题被看见、让不同意见被听懂、再把讨论落到决定的人。这样的人降低了合作成本，也减少了关键问题被拖延的风险。\u003c/p>\n\u003ch2>今天可以做的一件小事\u003c/h2>\n\u003cp>用 20 分钟处理一场你正在回避的对话。\u003c/p>\n\u003cp>先写四行：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>事实：\u003c/strong> 摄像头能记录到什么，不评价动机。\u003c/li>\n\u003cli>\u003cstrong>目标：\u003c/strong> 你希望自己、对方和这段关系分别得到什么。\u003c/li>\n\u003cli>\u003cstrong>开场：\u003c/strong> “我想聊一下___，因为___对我们都重要。过去发生了___，我的理解是___，也可能没看全，你怎么看？”\u003c/li>\n\u003cli>\u003cstrong>下一步：\u003c/strong> 你希望谈完后明确谁做什么、何时完成。\u003c/li>\n\u003c/ol>\n\u003cp>写完后，把开场消息发出去，约一个 10 分钟的沟通时间。今天的目标不是一次解决所有问题，而是让真问题开始被谈。\u003c/p>\n\u003ch2>以后回看时看这 3 行\u003c/h2>\n\u003cul>\n\u003cli>关键对话失控时，先恢复共同目标和安全感，再继续讨论内容。\u003c/li>\n\u003cli>把事实、解释和情绪分开，坚定表达，也给对方补充信息的空间。\u003c/li>\n\u003cli>谈话最后必须落到负责人、动作、期限和复盘时间。\u003c/li>\n\u003c/ul>"},{"title":"2026-07-27｜《思考，快与慢》","author":"","category":"未分类","date":"2026-07-27","topic":"思考快与慢","summary":"这本书解决的不是“怎么变聪明”，而是一个更实用的问题：为什么明明不笨的人，还是会在投资、职业选择、合作和关系里反复做错判断。 诺贝尔经济学奖得主丹尼尔·卡尼曼把人的…","quotes":["直觉让我们快速生活，数据和复盘让我们少犯大错。","你觉得“很顺”的解释，未必比事实更可靠。","一个好故事可以解释过去，却不必然能预测未来。","第一印象是起点，不该成为结论。","看得见的成功样本，常常遮住看不见的失败样本。","真正成熟的判断，是先承认自己也会被误导。","面对不确定性，区间通常比一个漂亮的数字更诚实。","重要决定的价值，不在于显得果断，而在于经得起回看。"],"review":"快思考负责效率，慢思考负责重要决定。","content":"\u003ch2>今天为什么读这本\u003c/h2>\n\u003cp>这本书解决的不是“怎么变聪明”，而是一个更实用的问题：为什么明明不笨的人，还是会在投资、职业选择、合作和关系里反复做错判断。\u003c/p>\n\u003cp>诺贝尔经济学奖得主丹尼尔·卡尼曼把人的思考方式拆开讲明白了：大脑喜欢省力，于是常用直觉快速下结论；可一旦问题复杂，直觉就很容易被情绪、故事和第一印象带偏。它适合在你准备做重要决定、觉得自己“已经想清楚了”、或被某个机会催得很急时读。\u003c/p>\n\u003cp>长期看，判断力就是普通人最能积累的能力之一。资源、人脉和机会会变化，但能否识别自己正在犯什么错，决定了你能不能少交昂贵的学费。\u003c/p>\n\u003ch2>这本书在讲什么\u003c/h2>\n\u003cp>卡尼曼用两个“系统”解释人的判断：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>系统 1\u003c/strong>：快、自动、凭直觉。看到熟人、躲开危险、判断一句话的语气，它都很擅长；但它也爱凭印象脑补因果。\u003c/li>\n\u003cli>\u003cstrong>系统 2\u003c/strong>：慢、费劲、需要注意力。算一道题、比较多个方案、检查合同，它能做得更稳；但它懒，容易默认系统 1 的答案。\u003c/li>\n\u003c/ul>\n\u003cp>问题不在于直觉本身。日常生活离不开系统 1；真正的风险是：我们常把“感觉顺”误当成“判断对”。书中由此解释了一串常见偏差：第一印象会锚定后续判断，容易想起的例子会被误认为更常发生，喜欢一个人的某个优点会让我们高估他的全部能力，而预测未来时又普遍太自信。\u003c/p>\n\u003cp>卡尼曼的结论很克制：人不可能消灭偏见，但可以把关键决定从“凭感觉拍板”变成“有流程地校正”。\u003c/p>\n\u003ch2>我真正应该带走的 5 个判断\u003c/h2>\n\u003ch3>1. 反应很快，不等于判断很准\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 流畅、熟悉、听起来有道理的信息，会让人产生“它是真的”的错觉。销售话术、热点观点和熟人推荐都容易借此影响你。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 遇到让你立刻想答应的机会，强制写下两个反面证据：它可能错在哪里？最坏结果是什么？\u003c/p>\n\u003ch3>2. 先看到的数字，会悄悄决定你的心理价位\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 锚定效应会让第一个报价、目标或估值成为参照，即使它本来毫无依据。谈薪、买房、谈合作都一样。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 在听对方报价前，先自己查 3 个可比案例，写下合理区间；谈判时围绕区间谈，不围绕对方抛出的单点数字谈。\u003c/p>\n\u003ch3>3. 生动的故事不是概率\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 一个朋友靠某项目赚到钱，比十年的行业数据更容易打动人；但容易想起，不代表发生概率高。这是追热点和幸存者偏差的根源。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 每次听到“某人就是这样成功的”，补问一句：同样做法的 100 个人里，有多少人失败且没人讲？\u003c/p>\n\u003ch3>4. 预测要看基准率，别只看这个故事有多动人\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 我们爱根据个案推演未来，却忽略同类事情通常的结果。基准率能把过度乐观拉回现实。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 做职业、创业或投资决策时，先找“同类项目平均活多久、收入分布怎样、失败原因是什么”，再看自己的特殊优势是否真的能改变平均结果。\u003c/p>\n\u003ch3>5. 重要决定要设计流程，而不是等状态好\u003c/h3>\n\u003cp>\u003cstrong>为什么重要：\u003c/strong> 情绪、疲惫和时间压力会放大系统 1 的错误。靠“我今天比较清醒”不稳定，靠检查清单更可靠。\u003c/p>\n\u003cp>\u003cstrong>怎么用：\u003c/strong> 为金额大、影响久、难撤回的事设一条规则：至少隔一晚；找一位不参与利益的人挑错；把判断依据写下来后再决定。\u003c/p>\n\u003ch2>金句\u003c/h2>\n\u003cul>\n\u003cli>直觉让我们快速生活，数据和复盘让我们少犯大错。\u003c/li>\n\u003cli>你觉得“很顺”的解释，未必比事实更可靠。\u003c/li>\n\u003cli>一个好故事可以解释过去，却不必然能预测未来。\u003c/li>\n\u003cli>第一印象是起点，不该成为结论。\u003c/li>\n\u003cli>看得见的成功样本，常常遮住看不见的失败样本。\u003c/li>\n\u003cli>真正成熟的判断，是先承认自己也会被误导。\u003c/li>\n\u003cli>面对不确定性，区间通常比一个漂亮的数字更诚实。\u003c/li>\n\u003cli>重要决定的价值，不在于显得果断，而在于经得起回看。\u003c/li>\n\u003c/ul>\n\u003ch2>和赚钱能力/人脉/情绪/不可替代性的关系\u003c/h2>\n\u003ch3>赚钱能力：把“机会感”换成“赔率感”\u003c/h3>\n\u003cp>赚钱不只靠发现机会，更靠区分高概率收益和高传播热度。看项目时同时写清收益上限、损失下限和同类成功率，能明显减少追逐看似暴利、实际赔率很差的事。\u003c/p>\n\u003ch3>人脉：别让光环替代观察\u003c/h3>\n\u003cp>一个人能说、名校、头衔亮眼，容易触发“光环效应”，让你默认他在合作、信用和执行力上也同样优秀。建立关系时，把人分开看：能力、诚信、兑现记录和利益是否一致，分别验证。\u003c/p>\n\u003ch3>情绪：感觉强烈时，结论要更慢\u003c/h3>\n\u003cp>焦虑会放大风险，兴奋会放大收益，愤怒会放大对错。情绪不是敌人，它是在提醒你“这里对我很重要”；但它不该直接替你做决定。把强烈情绪当成延迟决定的信号。\u003c/p>\n\u003ch3>不可替代性：训练可解释的判断\u003c/h3>\n\u003cp>大多数人能给观点，少数人能说明依据、概率和反例。后者在团队里更值得托付，也更难被替代。每次表达结论时，顺手说出“我依据什么、我最担心什么、什么信息会让我改主意”。\u003c/p>\n\u003ch2>今天可以做的一件小事\u003c/h2>\n\u003cp>用 \u003cstrong>20 分钟做一次“决策预演”\u003c/strong>：选一件你最近正犹豫的事，在纸上写下“假设三个月后它失败了，最可能是哪三个原因”。然后为每个原因补一个现在就能验证的小问题。它会把模糊的担心，变成可查证的事实。\u003c/p>\n\u003ch2>以后回看时看这 3 行\u003c/h2>\n\u003cp>快思考负责效率，慢思考负责重要决定。   别被故事和第一印象牵着走，先看概率与可比案例。   给高代价决定加上延迟、反证和清单，判断会稳很多。\u003c/p>"},{"title":"2026-07-24｜《枪炮、病菌与钢铁》","author":"贾雷德·戴蒙德","category":"历史判断 / 底层认知","date":"2026-07-24","topic":"枪炮病菌与钢铁","summary":"这本书要回答一个看似宏大、其实和普通人很有关的问题：为什么有些国家、城市、公司或人，最后能形成压倒性的优势？是因为天生更聪明、更勤奋，还是因为更早站到了一个会不断放…","quotes":["历史的结果，往往比个人的天赋更早开始。","真正改变格局的，不是一件工具，而是一套能持续积累工具的条件。","领先不是突然发生的，它通常只是长期复利终于被看见。","资源会产生剩余，剩余才有分工，分工才会长出复杂能力。","看懂上游条件，比模仿下游结果更有用。","好位置不是运气的同义词，它也意味着更低的传播和协作成本。","任何优势都要问一句：它能不能被复制、被传递、被放大？","不要用道德解释结构，也不要用结构放弃行动。","普通人最值得寻找的，是能让小努力反复生效的环境。"],"review":"不要只看结果，要找到结果背后的上游条件。","content":"\u003ch2>今天为什么读这本\u003c/h2>\n\u003cp>这本书要回答一个看似宏大、其实和普通人很有关的问题：为什么有些国家、城市、公司或人，最后能形成压倒性的优势？是因为天生更聪明、更勤奋，还是因为更早站到了一个会不断放大的位置？\u003c/p>\n\u003cp>适合在你想理解世界格局、看清行业机会，或正在怀疑“努力到底有没有用”时读。它不会给你一条逆袭口诀，但会帮你换一个更有效的观察角度：长期结果，往往不是由一次决策决定，而是由资源、位置、工具、协作网络和时间共同累积出来。\u003c/p>\n\u003cp>对长期能力来说，它提醒你少沉迷于“我够不够厉害”，多去找“我能不能站进一个会复利的环境”。\u003c/p>\n\u003ch2>这本书在讲什么\u003c/h2>\n\u003cp>贾雷德·戴蒙德是生理学家、地理学家和历史学者。这本书的起点是一个尖锐问题：为什么近代以来，欧亚大陆的一些社会征服、影响了其他地区，而不是反过来？作者反对用种族或智力解释差异，转而追问更早的条件。\u003c/p>\n\u003cp>他的核心链条是：\u003cstrong>地理条件 → 可驯化动植物 → 粮食剩余 → 人口与分工 → 技术、组织与病菌优势 → 历史结果。\u003c/strong>\u003c/p>\n\u003cp>有利于农业的地区，能更早稳定地获得粮食。粮食一旦有剩余，就不必所有人都种地，于是会出现工匠、士兵、管理者、商人和知识生产者；人口密度更高，也更容易形成国家、文字、技术和贸易网络。\u003c/p>\n\u003cp>欧亚大陆横向延展，很多地区纬度相近，作物、牲畜和技术更容易传播；美洲和非洲南北跨度大，气候带变化更剧烈，传播成本更高。这些早期差异经过几千年累积，最终表现为钢铁武器、航海技术、政治组织和对病菌的免疫优势。\u003c/p>\n\u003cp>书名里的“枪炮、病菌与钢铁”不是说它们凭空创造强大，而是说它们是更深层条件长期累积后的外在结果。读这本书最重要的，不是记住哪块大陆有什么作物，而是学会区分：什么是表面结果，什么是上游原因。\u003c/p>\n\u003ch2>我真正应该带走的 5 个判断\u003c/h2>\n\u003col>\n\u003cli>今天看见的强弱，通常是很早以前条件差异的结果。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：只看当下表现，很容易把领先者神化，把落后者简单归为不努力。这样既看不懂世界，也找不到改变的抓手。\u003c/p>\n\u003cp>怎么用：观察一家公司或一个人时，别只问“现在做得好不好”，还要问：它的客户来源、渠道、技能、现金流和信任，是从什么时候开始积累的？\u003c/p>\n\u003col>\n\u003cli>可复制、可传播的东西，才会变成真正的优势。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：一次成功、一个爆款、一个能人都不够稳。能跨时间、跨场景复制的流程、知识和关系网络，才会不断放大。\u003c/p>\n\u003cp>怎么用：做完一件有效的事，花 15 分钟把它写成模板：当时解决什么问题、步骤是什么、谁能复用、什么条件下不适用。\u003c/p>\n\u003col>\n\u003cli>位置比蛮力更早决定上限。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：努力仍然重要，但在错误的场域里，努力的回报会被环境吃掉。好的位置能让同样的投入获得更多反馈、合作和机会。\u003c/p>\n\u003cp>怎么用：评估一个机会时，增加三个问题：我能接触到更好的信息吗？能认识到关键的人吗？我的成果会被更多人看见和复用吗？\u003c/p>\n\u003col>\n\u003cli>分工和协作，会把个人能力变成系统能力。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：一个人再强，也受时间和注意力限制。真正拉开距离的，是能否让不同专长的人围绕同一目标持续协作。\u003c/p>\n\u003cp>怎么用：别把人脉当联系人列表。每月挑一位互补的人，带着一个具体问题交流：你提供什么、对方擅长什么、能否一起做一个小成果。\u003c/p>\n\u003col>\n\u003cli>不要把结果倒过来当原因。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：有钱的人看起来更自律，大公司看起来更专业，领先行业看起来更有远见；但其中很多特征，是资源积累后的结果，而不是最初原因。\u003c/p>\n\u003cp>怎么用：每次看到一个“成功经验”，追问两层：它依赖了哪些我看不见的前提？如果把这些前提拿掉，这个方法还成立吗？\u003c/p>\n\u003ch2>金句\u003c/h2>\n\u003col>\n\u003cli>历史的结果，往往比个人的天赋更早开始。\u003c/li>\n\u003cli>真正改变格局的，不是一件工具，而是一套能持续积累工具的条件。\u003c/li>\n\u003cli>领先不是突然发生的，它通常只是长期复利终于被看见。\u003c/li>\n\u003cli>资源会产生剩余，剩余才有分工，分工才会长出复杂能力。\u003c/li>\n\u003cli>看懂上游条件，比模仿下游结果更有用。\u003c/li>\n\u003cli>好位置不是运气的同义词，它也意味着更低的传播和协作成本。\u003c/li>\n\u003cli>任何优势都要问一句：它能不能被复制、被传递、被放大？\u003c/li>\n\u003cli>不要用道德解释结构，也不要用结构放弃行动。\u003c/li>\n\u003cli>普通人最值得寻找的，是能让小努力反复生效的环境。\u003c/li>\n\u003c/ol>\n\u003ch2>和赚钱能力/人脉/情绪/不可替代性的关系\u003c/h2>\n\u003cp>赚钱能力：收入不只来自“把一件事做得更辛苦”，更来自站进有需求、有反馈、有复用空间的场景。选择行业、客户和渠道，本身就是赚钱能力的一部分。\u003c/p>\n\u003cp>人脉：有价值的关系不是泛泛认识，而是处在同一信息流、能互相补位、能把机会传递下去的人。共同完成过一件小事，比交换十张名片更有价值。\u003c/p>\n\u003cp>情绪管理：把一时的比较放回时间尺度里。别人今天的领先，可能是多年的积累；你的任务不是否定自己，而是找到一个能连续积累五年的方向。\u003c/p>\n\u003cp>不可替代性：不可替代不是“只有你会一项技能”，而是你能把知识、经验、合作关系和可信的交付方式连成一套。别人即使会其中一块，也很难马上复制整条链。\u003c/p>\n\u003ch2>今天可以做的一件小事\u003c/h2>\n\u003cp>用 20 分钟画一张自己的“优势地图”。在纸上写下你目前最想发展的一个方向，然后分四格：已有技能、能接触的人、可见的需求、可重复的产出。每格至少写 3 项，最后圈出一项你能在本周做成模板或作品集的产出。\u003c/p>\n\u003cp>例如：如果你想做内容，技能可以是选题和表达；人是三位懂行业的朋友；需求是帮小团队讲清产品；可重复产出则是一份“产品拆解短文模板”。\u003c/p>\n\u003ch2>以后回看时看这 3 行\u003c/h2>\n\u003col>\n\u003cli>不要只看结果，要找到结果背后的上游条件。\u003c/li>\n\u003cli>选择能传播、能复用、能协作的环境，优势才会复利。\u003c/li>\n\u003cli>个人努力不该停，但要尽量让每次努力留下可积累的东西。\u003c/li>\n\u003c/ol>"},{"title":"2026-07-24｜《贫穷的本质》","author":"阿比吉特·班纳吉、埃斯特·迪弗洛","category":"经济判断","date":"2026-07-24","topic":"贫穷的本质","summary":"《贫穷的本质》解决的，是一个很容易被说粗的问题：一个人长期没有起色，到底是因为不努力、没资源，还是他所处的环境让每一步都更难选对？ 这本书适合在你想理解社会、赚钱、…","quotes":["人在稀缺中做出的短期选择，往往不是不聪明，而是没有余地。","解决问题，不是先问谁该被责备，而是先问哪一步最难做对。","知道正确答案，不等于现实里有条件执行它。","真正有用的改变，常常只是把正确动作变得更容易。","好的判断不是寻找万能答案，而是针对具体问题做小验证。","缓冲不是浪费，它让你在压力来临时仍保有选择权。","不要把个体困境浪漫化，也不要把系统问题道德化。","善意需要结果校验，否则很容易变成昂贵的自我感动。","小规模实验，是普通人买得起的决策工具。"],"review":"稀缺会让好选择变难，缓冲就是选择权。","content":"\u003ch2>今天为什么读这本\u003c/h2>\n\u003cp>《贫穷的本质》解决的，是一个很容易被说粗的问题：一个人长期没有起色，到底是因为不努力、没资源，还是他所处的环境让每一步都更难选对？\u003c/p>\n\u003cp>这本书适合在你想理解社会、赚钱、做产品，或者对“为什么有人明明很努力却总卡住”感到困惑时读。两位作者不是先站在道德高地给结论，而是用大量真实实验和田野调查，把贫困、教育、健康、借贷、储蓄等问题拆开看。\u003c/p>\n\u003cp>它真正能给你的，是一种经济判断力：别急着把结果归因于性格；先看一个人有什么选择、信息、缓冲和激励。这个视角也能帮助你审视自己——你缺的究竟是意志力，还是一个更容易做对的系统。\u003c/p>\n\u003ch2>这本书在讲什么\u003c/h2>\n\u003cp>作者阿比吉特·班纳吉和埃斯特·迪弗洛是发展经济学家，后来共同获得诺贝尔经济学奖。他们最重要的方法不是宏大口号，而是“随机对照实验”：把一个具体问题拆小，比较不同做法到底有没有效果。\u003c/p>\n\u003cp>书的主张可以概括为：贫穷不是单一原因造成的，更不是“懒”一个字能解释。穷人和所有人一样会计算、会期待、会犯错；只是他们面对的选择更贵、容错更低、信息更差。一次看错病、一次借错钱、一次错过孩子教育，都可能让生活重新掉回原点。\u003c/p>\n\u003cp>第一层，是稀缺会挤占判断力。钱、时间、信息都紧时，人会更关注眼前紧急的事，而不是长期收益。这不是道德缺陷，而是每个人在压力下都会有的反应。\u003c/p>\n\u003cp>第二层，是“好选择”常常不够容易。比如知道预防疾病重要，不等于会主动接种；知道储蓄重要，不等于月底还有钱。很多有效的改变，不是反复说教，而是降低行动门槛、给出及时的小激励、把默认选项设计好。\u003c/p>\n\u003cp>第三层，是不要迷信万能方案。教育、医疗、金融、创业都没有一句话的答案。真正有效的做法，往往来自对具体人群、具体情境、具体障碍的耐心验证。\u003c/p>\n\u003cp>这本书并不是让人放弃个人责任，而是把责任放回真实世界：人要努力，但好系统能让努力更有结果；政策和产品要有善意，更要经得起结果检验。\u003c/p>\n\u003ch2>我真正应该带走的 5 个判断\u003c/h2>\n\u003col>\n\u003cli>别把长期困境简单解释成“他不够努力”。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：单一归因会让你错过真正的杠杆。很多人不是不知道该做什么，而是没有现金缓冲、可靠信息、可承受的试错成本。\u003c/p>\n\u003cp>怎么用：看自己或别人卡住时，先列出三个现实条件：钱的缓冲、时间的余量、信息的质量。先补最短的一块，再谈执行力。\u003c/p>\n\u003col>\n\u003cli>稀缺会让人更短视，所以要提前给自己留余地。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：当账户、时间表和情绪都只剩一点空间时，人最容易做出高成本的临时决定。\u003c/p>\n\u003cp>怎么用：把“缓冲”当成能力的一部分。每月先留一笔小额应急金；每周预留两段不排事的时间；重要决定至少隔一晚再确认。\u003c/p>\n\u003col>\n\u003cli>想改变行为，先让正确动作变得容易。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：知道和做到之间，常常隔着摩擦。复杂的计划、模糊的目标、遥远的回报，都会让好意图消失。\u003c/p>\n\u003cp>怎么用：把一个目标缩成默认动作。例如不要写“我要学投资”，而是设成“每周三晚 20 分钟看一家公司，并写下它靠什么赚钱”。\u003c/p>\n\u003col>\n\u003cli>小实验比大判断更可靠。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：很多决定看起来很大，实际上可以先低成本试一次。你不需要先证明自己永远正确，先获得一轮真实反馈就够了。\u003c/p>\n\u003cp>怎么用：面对课程、副业、合作或产品想法，先设计一个两周试验：投入不超过多少、验证什么、什么结果说明值得继续。\u003c/p>\n\u003col>\n\u003cli>善意不等于有效，结果才是检验。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：一个听起来正确的方法，可能因为流程、时机或对象不对而失效。只看动机，会把资源花在“感觉很好”的地方。\u003c/p>\n\u003cp>怎么用：每次做长期投入前，先写下可观察的结果。比如不是“多认识人”，而是“这个月和 3 位同行做一次有具体主题的深聊，并复盘是否获得了新机会或新判断”。\u003c/p>\n\u003ch2>金句\u003c/h2>\n\u003col>\n\u003cli>人在稀缺中做出的短期选择，往往不是不聪明，而是没有余地。\u003c/li>\n\u003cli>解决问题，不是先问谁该被责备，而是先问哪一步最难做对。\u003c/li>\n\u003cli>知道正确答案，不等于现实里有条件执行它。\u003c/li>\n\u003cli>真正有用的改变，常常只是把正确动作变得更容易。\u003c/li>\n\u003cli>好的判断不是寻找万能答案，而是针对具体问题做小验证。\u003c/li>\n\u003cli>缓冲不是浪费，它让你在压力来临时仍保有选择权。\u003c/li>\n\u003cli>不要把个体困境浪漫化，也不要把系统问题道德化。\u003c/li>\n\u003cli>善意需要结果校验，否则很容易变成昂贵的自我感动。\u003c/li>\n\u003cli>小规模实验，是普通人买得起的决策工具。\u003c/li>\n\u003c/ol>\n\u003ch2>和赚钱能力/人脉/情绪/不可替代性的关系\u003c/h2>\n\u003cp>赚钱能力：赚钱能力不仅是找到机会，也是在机会出现前保留选择权。没有现金和时间缓冲的人，往往只能接眼前最急的单、做最短期的选择。先建立缓冲，再提高判断，收入才更稳。\u003c/p>\n\u003cp>情绪管理：焦虑时容易责怪自己“怎么又没坚持”，但先看看是不是目标太大、反馈太慢、生活余量太少。把任务改小、把下一步改清楚，比靠自责硬撑有效得多。\u003c/p>\n\u003cp>不可替代性：会喊观点的人很多，能把复杂问题拆成可验证的小实验，并据结果不断调整的人很少。这种把理解变成行动系统的能力，会越来越值钱。\u003c/p>\n\u003ch2>今天可以做的一件小事\u003c/h2>\n\u003cp>花 20 分钟，给你最近最焦虑的一件事做一次“条件复盘”。\u003c/p>\n\u003cp>写下三列：我真正想解决什么？我现在缺的是钱、时间、信息还是方法？我能在 7 天内做的最小实验是什么？\u003c/p>\n\u003cp>例如：不是“我要做副业”，而是“我想验证自己能否为小商家做直播脚本；这周联系 2 位商家，免费给各写一页脚本，记录他们是否愿意继续聊”。\u003c/p>\n\u003ch2>以后回看时看这 3 行\u003c/h2>\n\u003col>\n\u003cli>稀缺会让好选择变难，缓冲就是选择权。\u003c/li>\n\u003cli>不要迷信大方案；先做低成本、可验证的小实验。\u003c/li>\n\u003cli>先改善行动条件，再要求自己更有执行力。\u003c/li>\n\u003c/ol>"},{"title":"2026-07-23｜《影响力》","author":"罗伯特·西奥迪尼","category":"人际影响","date":"2026-07-23","topic":"影响力","summary":"《影响力》解决的不是“怎么套路别人”，而是一个更现实的问题：人在合作、消费、谈判和社交里，为什么会答应本来未必想答应的事。 普通人常常把机会、成交和人脉理解成“会说…","quotes":["人愿意答应你，往往不是因为你说得多，而是因为他看见了确定性。","先给一点价值可以开启关系，但不能把善意变成对方的债。","小承诺能推动行动，也可能把人推离自己的方向。","多数人的选择值得参考，却永远不该替你做决定。","喜欢不是讨好，而是让人感到被理解和被尊重。","头衔能借来信任，结果才能留下信任。","越强调“最后机会”，越要回到自己的真实需求。","最稳的人脉，不是认识得早，而是一起扛过事。","影响力的底线，是让对方在充分理解后仍愿意选择。"],"review":"影响力的本质，是降低不确定感，不是操纵别人。","content":"\u003ch2>今天为什么读这本\u003c/h2>\n\u003cp>《影响力》解决的不是“怎么套路别人”，而是一个更现实的问题：人在合作、消费、谈判和社交里，为什么会答应本来未必想答应的事。\u003c/p>\n\u003cp>普通人常常把机会、成交和人脉理解成“会说话”。但真正拉开差距的，是看懂人如何做决定：什么会让人放心，什么会让人防备，什么样的承诺容易被执行，什么样的关系只能停在热闹层面。\u003c/p>\n\u003cp>罗伯特·西奥迪尼长期研究社会心理学，也亲自观察过销售、募捐、招募等场景。这本书把复杂的人性规律整理成可识别的线索。它适合在你准备谈合作、做销售、经营个人品牌，或总觉得自己容易被别人带节奏时读。\u003c/p>\n\u003cp>它和长期能力的关系在于：看懂影响力，既能让你更会建立信任，也能让你少交“情绪税”和“面子税”。\u003c/p>\n\u003ch2>这本书在讲什么\u003c/h2>\n\u003cp>书的核心是：人不是每次都从头分析后再做决定。为了省时间和精力，我们会使用一些心理上的“快捷判断”。这些快捷判断大多数时候有用，但也会被有意设计。\u003c/p>\n\u003cp>西奥迪尼最早总结了六种常见的影响力原则，后来在新版中加入“团结”。理解它们，不是为了操纵别人，而是为了把沟通设计得更真诚、更有效，也为了在该警惕时及时刹车。\u003c/p>\n\u003cp>第一，互惠。别人先给了你帮助、好处或善意，你会天然想回报。它能开启关系，但如果对方先用很小的付出制造亏欠感，再索取远超价值的回报，就要停下来算账。\u003c/p>\n\u003cp>第二，承诺与一致。人希望自己的言行前后一致，因为这会让自己看起来可靠。小承诺能带来行动，但也可能把人一步步推向原本不会接受的事。关键是：承诺要服务于你的目标，不要服务于别人替你设好的轨道。\u003c/p>\n\u003cp>第三，社会认同。当我们不确定时，会看“和我类似的人怎么做”。评价、案例、朋友推荐之所以有效，是因为它们减少了判断成本。问题是，热闹不等于适合你，样本也可能被挑选过。\u003c/p>\n\u003cp>第四，喜好。我们更容易答应喜欢的人。相似、赞美、共同目标、熟悉感都会增加好感。真正有价值的用法不是讨好，而是让对方感到被理解，并让合作过程本身舒服、清晰。\u003c/p>\n\u003cp>第五，权威。专业资质、经验、身份和证据会降低信任成本。但要区分“看起来专业”与“真的对这件事专业”：头衔能说明过去，不能替代对具体问题的判断。\u003c/p>\n\u003cp>第六，稀缺。越难得到、越可能失去的东西，越会放大人的行动冲动。稀缺有时是真实信息，比如限量资源；也常被包装成倒计时、名额和焦虑。判断重点不是“快没了”，而是“它是否真的值得我拥有”。\u003c/p>\n\u003cp>第七，团结。人更愿意帮助“自己人”。共同身份、共同经历、共同承担，能建立比泛泛社交更深的信任。它提醒我们：人脉壁垒不是认识多少人，而是在关键群体里是否真有共同利益和互相成全的记录。\u003c/p>\n\u003ch2>我真正应该带走的 5 个判断\u003c/h2>\n\u003col>\n\u003cli>信任不是靠说服堆出来的，而是靠降低对方的不确定感。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：别人不答应，很多时候不是不认可你，而是不知道风险由谁承担、结果能否兑现。\u003c/p>\n\u003cp>怎么用：谈合作时少讲空泛愿景，多补三件事：你已经做过什么、下一步怎么验证、出了问题谁负责。让对方容易判断，比让对方激动更重要。\u003c/p>\n\u003col>\n\u003cli>小承诺是建立行动的好工具，也是最隐蔽的陷阱。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：一旦人公开表态，往往会为了保持一致而继续投入，即使方向已经不对。\u003c/p>\n\u003cp>怎么用：对自己，把大目标拆成一个小而可验证的承诺；对外，当对方不断要求你“先答应一点点”时，定期回到原问题：这件事还符合我的目标和边界吗？\u003c/p>\n\u003col>\n\u003cli>别人的选择可以当线索，不能当结论。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：跟随多数能节省时间，但多数人也会追逐热点、展示幸存者结果，甚至被虚假数据带偏。\u003c/p>\n\u003cp>怎么用：看到“很多人都买”“圈内人都在做”时，额外问两句：这些人和我的条件相同吗？他们的真实结果和代价是什么？\u003c/p>\n\u003col>\n\u003cli>最好的影响力来自价值与边界同时清楚。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：只会迎合的人很难被尊重；只讲边界、不创造价值的人也难合作。两者兼具，关系才能长期。\u003c/p>\n\u003cp>怎么用：每次重要沟通先写一句：我能提供什么具体价值？我不能接受什么条件？这会让你既不讨好，也不失联。\u003c/p>\n\u003col>\n\u003cli>稀缺感最容易让人用未来后悔，换眼前冲动。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：错过恐惧会放大商品、机会和关系的价值，让人忽略真实成本。\u003c/p>\n\u003cp>怎么用：面对限时机会，先把倒计时从脑中拿掉，写下“如果它明天仍然存在，我会因为什么购买或答应”。写不出理由，就不该被催促决定。\u003c/p>\n\u003ch2>金句\u003c/h2>\n\u003col>\n\u003cli>人愿意答应你，往往不是因为你说得多，而是因为他看见了确定性。\u003c/li>\n\u003cli>先给一点价值可以开启关系，但不能把善意变成对方的债。\u003c/li>\n\u003cli>小承诺能推动行动，也可能把人推离自己的方向。\u003c/li>\n\u003cli>多数人的选择值得参考，却永远不该替你做决定。\u003c/li>\n\u003cli>喜欢不是讨好，而是让人感到被理解和被尊重。\u003c/li>\n\u003cli>头衔能借来信任，结果才能留下信任。\u003c/li>\n\u003cli>越强调“最后机会”，越要回到自己的真实需求。\u003c/li>\n\u003cli>最稳的人脉，不是认识得早，而是一起扛过事。\u003c/li>\n\u003cli>影响力的底线，是让对方在充分理解后仍愿意选择。\u003c/li>\n\u003c/ol>\n\u003ch2>和赚钱能力/人脉/情绪/不可替代性的关系\u003c/h2>\n\u003cp>赚钱能力：成交、谈薪、求资源，本质上都在降低对方的选择风险。学会用真实案例、明确交付和小规模验证建立信任，你会比只会“硬推”的人走得更远。\u003c/p>\n\u003cp>人脉壁垒：真正稀缺的关系不是通讯录，而是互惠记录。先稳定地给出小而具体的价值，再在共同项目里守住承诺，别人会把你放进“值得合作的人”那一层。\u003c/p>\n\u003cp>情绪管理：当你被限时、名额、名人背书或群体热情催得焦虑时，先识别这是不是影响力按钮被按下了。看清机制，情绪就不会替你做决定。\u003c/p>\n\u003cp>不可替代性：会做事的人很多；既能创造价值，又能让不同的人愿意信任、配合和长期合作的人更少。后者才更难被替换。\u003c/p>\n\u003ch2>今天可以做的一件小事\u003c/h2>\n\u003cp>花 20 分钟，复盘你最近一次“答应得太快”或“买得太快”的决定。写下四句话：当时是谁或什么在影响我？触发了互惠、从众、权威、稀缺中的哪一种？我真正想得到什么？下次遇到同类情况，我先问自己哪一个问题？\u003c/p>\n\u003cp>最后把那句问题存进手机备忘录。例如：\u003cstrong>“如果没有倒计时，我还会选它吗？”\u003c/strong>\u003c/p>\n\u003ch2>以后回看时看这 3 行\u003c/h2>\n\u003col>\n\u003cli>影响力的本质，是降低不确定感，不是操纵别人。\u003c/li>\n\u003cli>互惠、承诺、从众、权威和稀缺，既能帮你沟通，也会让你失去判断。\u003c/li>\n\u003cli>长期人脉靠共同价值与兑现记录，不靠一时热络。\u003c/li>\n\u003c/ol>"},{"title":"2026-07-22｜《原则》","author":"瑞·达利欧","category":"个人决策","date":"2026-07-22","topic":"原则","summary":"《原则》解决的是一个很现实的问题：一个人怎么把经验变成可复用的判断，而不是每次遇到事都靠情绪、感觉和临场发挥。 很多人不是没有经历，也不是不努力，而是经历过去就过去…","quotes":["没有被总结的经历，只是消耗过的时间。","真正成熟的人，不是永远正确，而是改错速度很快。","面子保护的是当下自尊，原则保护的是长期利益。","痛苦本身不会让人成长，痛苦后的反思才会。","一个人的上限，取决于他能不能诚实面对自己的问题。","好原则的价值，是让你在关键时刻少被情绪接管。","别把反馈当攻击，把反馈当成别人帮你看盲区。","你反复遇到的问题，往往不是运气问题，而是系统问题。","赚钱能力的底层，是看清现实后持续修正行动。","原则不是写给别人看的，是在你动摇时拿来执行的。"],"review":"经验不会自动变成能力，复盘后的经验才会。","content":"\u003ch2>今天为什么读这本\u003c/h2>\n\u003cp>《原则》解决的是一个很现实的问题：一个人怎么把经验变成可复用的判断，而不是每次遇到事都靠情绪、感觉和临场发挥。\u003c/p>\n\u003cp>很多人不是没有经历，也不是不努力，而是经历过去就过去了，没有沉淀成自己的做事标准。下次遇到类似问题，还是重新纠结、重新犯错、重新被情绪推着走。\u003c/p>\n\u003cp>达利欧这本书最值得看的地方，不是他创办了桥水基金，也不是他有多少投资成绩，而是他把自己反复试错后形成的工作和人生原则写了出来：遇到问题，要面对现实；遇到分歧，要追求真实；遇到失败，要找到机制原因；遇到复杂局面，要用清晰流程做判断。\u003c/p>\n\u003cp>这本书适合今天读，是因为它能帮你从“我觉得”切换到“我的原则是什么”。一个人越想成长、赚钱、建立人脉壁垒、变得不可替代，就越需要一套稳定的原则。否则能力越大，情绪和盲点造成的损失也会越大。\u003c/p>\n\u003ch2>这本书在讲什么\u003c/h2>\n\u003cp>《原则》的核心可以概括成一句话：把生活和工作中反复出现的问题，提炼成原则，再用原则指导下一次选择。\u003c/p>\n\u003cp>达利欧认为，人生更像一台不断反馈的机器。你有目标，采取行动，得到结果；如果结果不好，就要诊断问题，改进做法，再继续行动。真正厉害的人，不是从不失败，而是每次失败后都能升级自己的系统。\u003c/p>\n\u003cp>书里最重要的几个观点，可以拆成四层。\u003c/p>\n\u003cp>第一，极度求真。\u003c/p>\n\u003cp>很多人做决定时，最先保护的是面子、自尊和已有判断，而不是事实。达利欧强调，现实不会因为你不喜欢它而改变。你越早看清现实，越早承认问题，越有机会改。\u003c/p>\n\u003cp>这对个人成长特别关键。比如你想提升赚钱能力，就不能只问“我哪里有潜力”，还要看“我现在到底弱在哪里”：销售弱、表达弱、产品判断弱、现金流管理弱，还是选择圈子弱。承认问题不是否定自己，而是找到入口。\u003c/p>\n\u003cp>第二，极度透明。\u003c/p>\n\u003cp>在桥水，达利欧提倡把问题、分歧、错误都摆到台面上讨论。这个做法不一定适合所有环境，但背后的逻辑很重要：模糊会保护短期舒服，却伤害长期进步。\u003c/p>\n\u003cp>一个人如果总是回避反馈，就很难变强。别人不指出你的问题，你会舒服；但问题不消失，只是延后收账。\u003c/p>\n\u003cp>第三，把痛苦变成进化信号。\u003c/p>\n\u003cp>达利欧有一个很重要的思路：痛苦加反思，等于进步。痛苦本身没有价值，反思之后才有价值。失败、冲突、焦虑、被批评，如果只是让你难受，那它只是消耗；如果你能看见背后的原因，它就会变成升级系统的材料。\u003c/p>\n\u003cp>这和情绪管理关系很大。情绪不是用来压下去的，而是用来提醒你：这里有某个现实问题、关系问题、能力问题或期待问题需要处理。\u003c/p>\n\u003cp>第四，建立自己的原则库。\u003c/p>\n\u003cp>原则不是口号，而是下次能直接指导行动的规则。比如“重要合作先小规模试一次”“不在情绪高点做承诺”“不和长期利益不一致的人深度绑定”“一个机会如果解释不清楚，就先不重投入”。\u003c/p>\n\u003cp>这些原则看起来朴素，但它们能减少反复纠结。真正成熟的人，不是没有情绪，而是他已经提前想过很多场景，知道自己该怎么处理。\u003c/p>\n\u003ch2>我真正应该带走的 5 个判断\u003c/h2>\n\u003col>\n\u003cli>经验如果不被总结，就不会自动变成能力。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：很多人工作了很多年，但只是把同样的错误重复了很多年。时间不等于成长，复盘后的时间才更接近成长。\u003c/p>\n\u003cp>怎么用：每次遇到明显失败、冲突、焦虑或错失机会，都写下三句话：发生了什么？真正原因是什么？下次我的原则是什么？\u003c/p>\n\u003col>\n\u003cli>面子是判断力最大的敌人之一。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：人一旦开始保护面子，就容易回避事实、拒绝反馈、掩盖错误。短期看舒服，长期看会失去升级机会。\u003c/p>\n\u003cp>怎么用：当别人指出问题时，先不要急着解释。先问自己：如果他说的有 20% 是对的，那我该改什么？\u003c/p>\n\u003col>\n\u003cli>情绪痛点往往暴露了真实短板。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：你特别容易生气、焦虑、嫉妒或委屈的地方，通常藏着未满足的需求、未解决的能力缺口，或者错误的期待。\u003c/p>\n\u003cp>怎么用：不要只处理情绪表面。比如你对别人赚钱焦虑，可能真正要处理的是自己的商业能力、行动节奏和信息圈层。\u003c/p>\n\u003col>\n\u003cli>好原则会让你少靠意志力。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：意志力会波动，原则可以提前替你做选择。没有原则的人，每次都要重新和诱惑、恐惧、面子谈判。\u003c/p>\n\u003cp>怎么用：给高频问题提前设规则。比如“超过 3000 元的非必要支出隔夜再决定”“重要合作先看一次对方如何处理小利益冲突”。\u003c/p>\n\u003col>\n\u003cli>不可替代性来自持续升级自己的系统。\u003c/li>\n\u003c/ol>\n\u003cp>为什么重要：单个技能会过时，单次成功会过去，但一个能发现问题、吸收反馈、修正方法的人，会越来越值钱。\u003c/p>\n\u003cp>怎么用：不要只问“我要学什么技能”，也要问“我怎么让自己每个月都比上个月更会判断、更会合作、更会赚钱”。\u003c/p>\n\u003ch2>金句\u003c/h2>\n\u003col>\n\u003cli>没有被总结的经历，只是消耗过的时间。\u003c/li>\n\u003cli>真正成熟的人，不是永远正确，而是改错速度很快。\u003c/li>\n\u003cli>面子保护的是当下自尊，原则保护的是长期利益。\u003c/li>\n\u003cli>痛苦本身不会让人成长，痛苦后的反思才会。\u003c/li>\n\u003cli>一个人的上限，取决于他能不能诚实面对自己的问题。\u003c/li>\n\u003cli>好原则的价值，是让你在关键时刻少被情绪接管。\u003c/li>\n\u003cli>别把反馈当攻击，把反馈当成别人帮你看盲区。\u003c/li>\n\u003cli>你反复遇到的问题，往往不是运气问题，而是系统问题。\u003c/li>\n\u003cli>赚钱能力的底层，是看清现实后持续修正行动。\u003c/li>\n\u003cli>原则不是写给别人看的，是在你动摇时拿来执行的。\u003c/li>\n\u003c/ol>\n\u003ch2>和赚钱能力/人脉/情绪/不可替代性的关系\u003c/h2>\n\u003cp>赚钱能力：赚钱不是只靠努力，而是靠不断修正判断。你要知道自己在什么市场里、提供什么价值、谁愿意为此付费、自己的短板在哪里。《原则》提醒你，不要沉迷感觉，要让结果反馈来修正你的行动。\u003c/p>\n\u003cp>人脉壁垒：真正的人脉不是热闹关系，而是别人相信你能稳定处理问题。一个有原则的人，边界清楚、利益分配稳定、遇到问题不逃避，更容易被长期合作的人信任。\u003c/p>\n\u003cp>情绪管理：这本书不是教你没有情绪，而是教你把情绪当信号。难受时不要只问“我怎么舒服一点”，还要问“这个痛苦暴露了什么现实问题”。\u003c/p>\n\u003cp>不可替代性：未来很多执行型工作都会变便宜，但能面对复杂现实、吸收反馈、形成原则、持续改进的人，会越来越稀缺。不可替代不是因为你什么都会，而是因为你能持续升级自己。\u003c/p>\n\u003ch2>今天可以做的一件小事\u003c/h2>\n\u003cp>花 20 分钟建立你的第一版“个人原则库”，只写 5 条。\u003c/p>\n\u003cp>格式很简单：\u003c/p>\n\u003col>\n\u003cli>我反复遇到的问题是什么？\u003c/li>\n\u003cli>这个问题真正的原因是什么？\u003c/li>\n\u003cli>下次遇到类似情况，我的原则是什么？\u003c/li>\n\u003c/ol>\n\u003cp>可以先从这几个方向挑：花钱、合作、学习、情绪、时间管理。\u003c/p>\n\u003cp>例子：我容易因为焦虑乱报课。原因是我把买课当成进步。原则是：任何课程购买前，先写清楚我要解决的具体问题，以及我是否已经用免费方式试过 3 天。\u003c/p>\n\u003ch2>以后回看时看这 3 行\u003c/h2>\n\u003col>\n\u003cli>经验不会自动变成能力，复盘后的经验才会。\u003c/li>\n\u003cli>情绪、失败和冲突，都是升级原则库的入口。\u003c/li>\n\u003cli>真正长期值钱的人，会持续把问题变成规则，把规则变成行动。\u003c/li>\n\u003c/ol>"}]; const dialog=document.querySelector('#reader'); const prevPage=document.querySelector('#previous-page'); const nextPage=document.querySelector('#next-page'); let readerSections=[]; let readerBook=null; let sectionIndex=0;
    const quotes=books.flatMap(book=>book.quotes.map(text=>({text,source:book.title.replace(/^\d{4}-\d{2}-\d{2}｜/, '')}))); let quoteIndex=Math.floor(Math.random()*Math.max(1,quotes.length));
    function showQuote(){const quote=quotes[quoteIndex];if(!quote)return;document.querySelector('#quote-text').textContent='“'+quote.text+'”';document.querySelector('#quote-source').textContent='—— '+quote.source;} showQuote();
    const refresh=document.querySelector('#refresh-quote'); if(refresh)refresh.onclick=()=>{quoteIndex=(quoteIndex+1+Math.floor(Math.random()*Math.max(1,quotes.length-1)))%quotes.length;showQuote();};
    const appShell=document.querySelector('.app-shell');
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));document.querySelectorAll('.panel').forEach(panel=>{panel.hidden=true;panel.classList.remove('active-panel')});tab.classList.add('active');appShell.classList.toggle('calendar-mode',tab.dataset.tab==='calendar-panel');const panel=document.querySelector('#'+tab.dataset.tab);panel.hidden=false;panel.classList.add('active-panel');}));
    function splitIntoSections(html){const box=document.createElement('div');box.innerHTML=html;const sections=[];let current={title:'继续阅读',html:''};[...box.children].forEach(node=>{if(node.tagName==='H2'){if(current.html.trim())sections.push(current);current={title:node.textContent.trim(),html:''};}else{current.html+=node.outerHTML;}});if(current.html.trim())sections.push(current);return sections.length?sections:[{title:'继续阅读',html:html}];}
    function estimateMinutes(fromIndex){const rest=readerSections.slice(fromIndex).map(section=>section.html.replace(/<[^>]+>/g,'')).join('');return Math.max(1,Math.ceil(rest.length/420));}
    function renderReader(){const total=Math.max(1,readerSections.length);const current=readerSections[sectionIndex]||{title:'继续阅读',html:''};const percent=Math.round(((sectionIndex+1)/total)*100);document.querySelector('#reader-current').textContent=String(sectionIndex+1).padStart(2,'0');document.querySelector('#reader-total').textContent=String(total).padStart(2,'0');document.querySelector('#reader-percent').textContent=percent+'%';document.querySelector('#progress-fill').style.width=percent+'%';document.querySelector('#reader-time').textContent='还需 '+estimateMinutes(sectionIndex)+' 分钟';document.querySelector('#reader-kicker').textContent=sectionIndex===0?'今日精读':'继续阅读';document.querySelector('#reader-title').textContent=current.title;document.querySelector('#reader-bookline').textContent=(readerBook.title||'').replace(/^\d{4}-\d{2}-\d{2}｜/,'')+(readerBook.author?' · '+readerBook.author:'');document.querySelector('#reader-page-content').innerHTML=current.html;document.querySelector('#reader-judgement').textContent='判断：'+(readerBook.review||readerBook.quotes?.[0]||'把这一段变成一个可以执行的判断。');prevPage.disabled=sectionIndex===0;nextPage.disabled=sectionIndex>=total-1;dialog.querySelector('.reader-body').scrollTop=0;}
    function openReader(index,startSection=0){readerBook=books[index];if(!readerBook)return;readerSections=splitIntoSections(readerBook.content);sectionIndex=Math.max(0,Math.min(startSection,readerSections.length-1));renderReader();dialog.showModal();}
    document.querySelectorAll('.open-reader,[data-open-index]').forEach(node=>node.addEventListener('click',()=>openReader(Number(node.dataset.openIndex))));
    prevPage.onclick=()=>{if(sectionIndex>0){sectionIndex-=1;renderReader();}};nextPage.onclick=()=>{if(sectionIndex<readerSections.length-1){sectionIndex+=1;renderReader();}};document.addEventListener('keydown',event=>{if(!dialog.open)return;if(event.key==='ArrowRight')nextPage.click();if(event.key==='ArrowLeft')prevPage.click();if(event.key==='Escape')dialog.close();});
    document.querySelector('#close').onclick=()=>dialog.close(); dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    const cards=[...document.querySelectorAll('.book-card')], empty=document.querySelector('#empty'), search=document.querySelector('#search'); if(search)search.addEventListener('input',e=>{const query=e.target.value.trim().toLowerCase();let shown=0;cards.forEach(card=>{const yes=card.innerText.toLowerCase().includes(query);card.style.display=yes?'':'none';if(yes)shown++});empty.style.display=shown?'none':'block'});
    const params=new URLSearchParams(location.search); if(params.has('reader'))openReader(Number(params.get('reader'))||0,Number(params.get('section'))||0);
  </script>
</body></html>
